[package]
name = "app-addons-stremio"
description = "Stremio addon protocol client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["reqwest"]
# The default transport (D60). Turn off to bring your own `Transport`.
reqwest = ["dep:reqwest"]

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", optional = true, features = ["gzip"] }

[lints]
workspace = true

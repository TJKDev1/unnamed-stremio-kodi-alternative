[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
# Default for the app (D37, D59). Server/sync crates override with AGPL-3.0-or-later,
# SDK crates with MIT; `cargo xtask check-licenses` enforces this.
license = "GPL-3.0-or-later"
repository = "https://github.com/TJKDev1/unnamed-stremio-kodi-alternative"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

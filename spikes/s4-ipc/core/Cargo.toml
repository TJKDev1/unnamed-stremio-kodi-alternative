[package]
name = "s4-core"
description = "Spike S4: toy view-model, generic and typed diffs, JSON/MessagePack/postcard, WebSocket server. Throwaway code (D65)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
postcard = { version = "1", features = ["use-std"] }
tungstenite = "0.27"
tiny_http = "0.12"

[dev-dependencies]
proptest = "1"
